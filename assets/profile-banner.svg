<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Thong Pham | Building systems for better AI</title>
  <desc id="desc">A navy, violet, and teal banner for a software engineer focused on LLM evaluation, data systems, and applied machine learning.</desc>
  <defs>

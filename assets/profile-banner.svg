    <radialGradient id="glow"><stop stop-color="#8571ed" stop-opacity=".3"/><stop offset="1" stop-color="#8571ed" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#c8bfff" opacity=".13"/></pattern>
  </defs>
